<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thrilok Hub | Premium Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .nav-item.active { color: #3b82f6; opacity: 1 !important; }
        .sel-active { border: 2px solid #3b82f6 !important; background: rgba(59, 130, 246, 0.1) !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        
        /* BANNER SLIDER CSS */
        .banner-wrapper { display: flex; transition: transform 0.5s ease-in-out; width: 100%; height: 100%; }
        .banner-slide { min-width: 100%; height: 100%; object-fit: cover; }
        
        /* PRODUCT SLIDER CSS */
        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; border-radius: 2rem; }
        .slider-item { min-width: 100%; scroll-snap-align: start; aspect-ratio: 1/1; object-fit: cover; border-radius: 2rem; }
        
        #success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .tick-circle { width: 80px; height: 80px; border-radius: 50%; background: #22c55e; display: flex; align-items: center; justify-content: center; animation: scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="pb-32">
    <div id="pwa-banner" style="display:none;" class="fixed top-0 left-0 w-full bg-blue-600 text-white p-4 z-[100] flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
        <img src="icon-192.png" class="w-10 h-10 rounded-lg">
        <div>
            <p class="text-xs font-bold uppercase tracking-widest">3lokasmahal</p>
            <p class="text-[10px] opacity-80">Install for faster experience</p>
        </div>
    </div>
    <button onclick="triggerInstall()" class="bg-white text-blue-600 px-6 py-2 rounded-full font-black uppercase text-[10px]">Install</button>
</div>


    <div id="success-overlay">
        <div class="tick-circle shadow-[0_0_50px_rgba(34,197,94,0.4)]"><i class="fa-solid fa-check text-4xl"></i></div>
        <h2 class="text-2xl font-black mt-6 uppercase italic">Order Confirmed!</h2>
    </div>

    <div id="auth-sec" class="fixed inset-0 z-[9000] bg-black flex items-center justify-center p-8">
        <div class="w-full max-w-sm space-y-6 text-center">
            <h1 class="text-4xl font-black italic text-blue-600 uppercase">THRILOK HUB</h1>
            <div id="login-fields" class="space-y-4">
                <input id="l-mobile" type="tel" placeholder="Mobile Number" class="w-full glass p-5 rounded-2xl outline-none border border-white/5">
                <input id="l-pass" type="password" placeholder="Password" class="w-full glass p-5 rounded-2xl outline-none border border-white/5">
                <button onclick="handleLogin()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase shadow-lg shadow-blue-600/20">Login</button>
                <p class="text-xs opacity-40 font-bold" onclick="toggleAuth(true)">Don't have account? <span class="text-blue-500 underline">Register</span></p>
            </div>
            <div id="reg-fields" class="hidden space-y-4">
                <input id="r-name" placeholder="Full Name" class="w-full glass p-5 rounded-2xl outline-none">
                <input id="r-mobile" type="tel" placeholder="Mobile" class="w-full glass p-5 rounded-2xl outline-none">
                <input id="r-pass" type="password" placeholder="Password" class="w-full glass p-5 rounded-2xl outline-none">
                <button onclick="handleRegister()" class="w-full bg-emerald-600 py-5 rounded-2xl font-black uppercase">Create Account</button>
                <p class="text-xs opacity-40 font-bold" onclick="toggleAuth(false)">Back to Login</p>
            </div>
        </div>
    </div>

    <header class="p-6 sticky top-0 z-50 glass rounded-b-[2rem] border-b border-white/5">
        <div class="flex justify-between items-center mb-4">
            <h1 class="font-black italic text-xl uppercase tracking-tighter">STORE</h1>
            <i class="fa-solid fa-power-off text-red-500 bg-white/5 p-3 rounded-full text-xs" onclick="logout()"></i>
        </div>
        <input type="text" id="p-search" oninput="searchProduct()" placeholder="Search gear..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
    </header>

    <main id="home-sec" class="tab-content active p-5 space-y-6">
        <div class="relative rounded-[2rem] overflow-hidden aspect-[16/9] bg-slate-900 border border-white/5">
            <div id="banner-wrapper" class="banner-wrapper"></div>
            <div id="banner-dots" class="absolute bottom-4 left-0 right-0 flex justify-center gap-2"></div>
        </div>
        
        <div class="flex gap-3 overflow-x-auto no-scrollbar" id="cat-scroll"></div>
        <div id="p-grid" class="grid grid-cols-2 gap-4"></div>
    </main>

    <section id="wishlist-sec" class="tab-content p-6">
        <h2 class="text-2xl font-black italic mb-6 uppercase">Wishlist</h2>
        <div id="wish-grid" class="grid grid-cols-2 gap-4"></div>
    </section>

    <section id="orders-sec" class="tab-content p-6">
        <h2 class="text-2xl font-black italic mb-6 uppercase">My Orders</h2>
        <div id="orders-list" class="space-y-4"></div>
    </section>

    <div id="product-modal" class="fixed inset-0 z-[100] bg-black hidden flex items-end">
        <div class="bg-[#050505] w-full h-full rounded-t-[2.5rem] overflow-y-auto no-scrollbar p-6">
            <button onclick="closeModal()" class="mb-6 w-10 h-10 glass rounded-full flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></button>
            <div id="modal-content" class="space-y-6 pb-24"></div>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 z-[200] bg-black hidden flex items-center justify-center p-8">
        <div class="w-full max-w-sm space-y-6">
            <div class="glass p-6 rounded-[2.5rem] space-y-4 border border-white/10">
                <input id="c-name" placeholder="Receiver Name" class="w-full bg-white/5 p-4 rounded-xl outline-none">
                <input id="c-phone" type="tel" placeholder="Mobile" class="w-full bg-white/5 p-4 rounded-xl outline-none">
                <textarea id="c-addr" placeholder="Full Address" class="w-full bg-white/5 p-4 rounded-xl h-24 outline-none"></textarea>
            </div>
            <div id="pay-options" class="grid grid-cols-2 gap-4">
                <button onclick="initOrder('COD')" class="glass p-4 rounded-xl font-black text-amber-500 uppercase">COD</button>
                <button onclick="initOrder('ONLINE')" class="bg-blue-600 p-4 rounded-xl font-black uppercase">Online Pay</button>
            </div>
            <div id="utr-sec" class="hidden glass p-6 rounded-[2.5rem] space-y-4 text-center border border-blue-500">
                <input id="c-utr" placeholder="12-Digit UTR" class="w-full bg-white/10 p-4 rounded-xl text-center outline-none font-black tracking-widest">
                <button onclick="confirmFinalOrder('ONLINE')" class="w-full bg-emerald-600 py-4 rounded-xl font-black uppercase italic">Confirm Order</button>
            </div>
            <button onclick="document.getElementById('checkout-modal').classList.add('hidden')" class="w-full text-center opacity-30 text-xs font-bold uppercase">Back</button>
        </div>
    </div>

    <nav class="fixed bottom-0 inset-x-0 h-20 glass rounded-t-[2.5rem] z-[90] flex items-center justify-around border-t border-white/5">
        <div onclick="showSection('home')" id="nav-home" class="nav-item active flex flex-col items-center opacity-40"><i class="fa-solid fa-house"></i><span class="text-[8px] mt-1 font-bold uppercase">Home</span></div>
        <div onclick="showSection('wishlist')" id="nav-wishlist" class="nav-item flex flex-col items-center opacity-40"><i class="fa-solid fa-heart"></i><span class="text-[8px] mt-1 font-bold uppercase">Wish</span></div>
        <div onclick="showSection('orders')" id="nav-orders" class="nav-item flex flex-col items-center opacity-40"><i class="fa-solid fa-box"></i><span class="text-[8px] mt-1 font-bold uppercase">Orders</span></div>
    </nav>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAwmqZpgzAsdwIURspaXeETp20ARbBR8lg", authDomain: "thtilok-store.firebaseapp.com", projectId: "thtilok-store" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
        // --- PWA & NOTIFICATIONS INTEGRATION ---
// --- ENHANCED PWA INSTALL LOGIC ---
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Website lo "Install App" ane banner or button unte automatic ga show chesthundhi
    const installBanner = document.getElementById('pwa-banner');
    if(installBanner) installBanner.style.display = 'flex';
});

async function triggerInstall() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            console.log('User installed the app');
        }
        deferredPrompt = null;
        // Install ayyaka banner ni hide chesthunnam
        const installBanner = document.getElementById('pwa-banner');
        if(installBanner) installBanner.style.display = 'none';
    } else {
        alert("App is already installed or browser not supporting!");
    }
}


// Service Worker for Push Notifications
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('firebase-messaging-sw.js').then(reg => {
        console.log("SW Registered");
        // Push permission permission aduguthundi
        Notification.requestPermission();
    });
}

        
        let currentUser = JSON.parse(localStorage.getItem('user')), allProducts = [], activeP = null, sS = '', sC = '', curQty = 1;
        let bannerIndex = 0, bannerCount = 0;

        window.onload = () => { if(currentUser) { document.getElementById('auth-sec').classList.add('hidden'); loadStore(); } };

        function toggleAuth(r) { document.getElementById('login-fields').classList.toggle('hidden', r); document.getElementById('reg-fields').classList.toggle('hidden', !r); }
        async function handleLogin() {
            const m = document.getElementById('l-mobile').value, p = document.getElementById('l-pass').value;
            const doc = await db.collection('users').doc(m).get();
            if(doc.exists && doc.data().pass === p) { currentUser = doc.data(); localStorage.setItem('user', JSON.stringify(currentUser)); location.reload(); }
            else alert("Error! Please check Mobile/Password");
        }
        async function handleRegister() {
            const n = document.getElementById('r-name').value, m = document.getElementById('r-mobile').value, p = document.getElementById('r-pass').value;
            if(!n || !m || !p) return alert("Fill all details");
            await db.collection('users').doc(m).set({ name: n, mobile: m, pass: p, role: 'user' });
            alert("Success! Please Login."); toggleAuth(false);
        }
        function logout() { localStorage.removeItem('user'); location.reload(); }

        async function loadStore() {
            const snap = await db.collection('products').get();
            allProducts = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
            render(allProducts, 'p-grid');
            
            const cats = ['All', ...new Set(allProducts.map(p => p.category))];
            document.getElementById('cat-scroll').innerHTML = cats.map(c => `<button onclick="filterCat('${c}', this)" class="cat-btn px-5 py-2 rounded-xl glass text-[10px] font-black uppercase shrink-0 ${c==='All'?'bg-blue-600':''}">${c}</button>`).join('');
            
            // LOAD BANNERS WITH AUTO SLIDE
            db.collection('banners').onSnapshot(s => {
                const banners = s.docs.map(d => d.data().url);
                bannerCount = banners.length;
                document.getElementById('banner-wrapper').innerHTML = banners.map(url => `<img src="${url}" class="banner-slide">`).join('');
                document.getElementById('banner-dots').innerHTML = banners.map((_, i) => `<div class="w-1.5 h-1.5 rounded-full ${i===0?'bg-white':'bg-white/20'} transition-all dot-id-${i}"></div>`).join('');
                startBannerSlide();
            });
        }

        function startBannerSlide() {
            setInterval(() => {
                bannerIndex = (bannerIndex + 1) % bannerCount;
                const wrapper = document.getElementById('banner-wrapper');
                if(wrapper) {
                    wrapper.style.transform = `translateX(-${bannerIndex * 100}%)`;
                    // Update Dots
                    document.querySelectorAll('#banner-dots div').forEach((dot, i) => {
                        dot.classList.toggle('bg-white', i === bannerIndex);
                        dot.classList.toggle('bg-white/20', i !== bannerIndex);
                        dot.classList.toggle('w-4', i === bannerIndex); // Active dot width increase
                    });
                }
            }, 3000);
        }

        function render(list, target) {
            document.getElementById(target).innerHTML = list.map(p => `<div class="glass p-3 rounded-[1.5rem]" onclick="openProduct('${p.id}')"><img src="${p.img1}" class="w-full aspect-square object-cover rounded-xl mb-2"><h3 class="font-black text-[10px] uppercase truncate opacity-60">${p.name}</h3><p class="text-blue-500 font-black text-xs">₹${p.price}</p></div>`).join('');
        }

        function openProduct(id) {
            activeP = allProducts.find(x => x.id === id); if(!activeP) return;
            sS = ''; sC = ''; curQty = 1;
            const isWish = (JSON.parse(localStorage.getItem('wish_'+currentUser.mobile) || '[]')).includes(id);
            const images = [activeP.img1, activeP.img2, activeP.img3].filter(img => img);
            
            document.getElementById('modal-content').innerHTML = `
                <div class="slider-container no-scrollbar">
                    ${images.map(img => `<img src="${img}" class="slider-item glass">`).join('')}
                </div>
                <div class="flex justify-center gap-1.5 mt-3">${images.map(() => `<div class="w-1.5 h-1.5 bg-white/20 rounded-full"></div>`).join('')}</div>
                <div class="flex justify-between items-center mt-6">
                    <h2 class="text-2xl font-black uppercase italic">${activeP.name}</h2>
                    <i class="fa-${isWish?'solid':'regular'} fa-heart text-2xl ${isWish?'text-red-500':'opacity-20'}" onclick="toggleWish('${id}')"></i>
                </div>
                <p class="text-3xl font-black text-blue-500">₹${activeP.price}</p>
                <div class="flex gap-2">${(activeP.sizes||"").split(',').map(s => `<button onclick="setS('${s}', this)" class="sz-btn glass px-4 py-2 rounded-xl text-xs font-bold border border-white/5">${s}</button>`).join('')}</div>
                <div class="flex gap-2">${(activeP.colors||"").split(',').map(c => `<button onclick="setC('${c}', this)" class="cl-btn glass px-4 py-2 rounded-xl text-xs font-bold border border-white/5">${c}</button>`).join('')}</div>
                <div class="glass p-5 rounded-2xl flex justify-between items-center">
                    <div class="flex gap-4 items-center"><button onclick="updQty(-1)" class="w-8 h-8 glass rounded-full font-bold">-</button><span id="qty-box" class="font-black text-lg">1</span><button onclick="updQty(1)" class="w-8 h-8 glass rounded-full font-bold">+</button></div>
                    <p id="total-box" class="font-black text-xl text-blue-500">₹${activeP.price}</p>
                </div>
                <button onclick="document.getElementById('checkout-modal').classList.remove('hidden')" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase italic">Proceed to Buy</button>`;
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function updQty(v) { curQty = Math.max(1, curQty + v); document.getElementById('qty-box').innerText = curQty; document.getElementById('total-box').innerText = '₹' + (curQty * activeP.price); }
        function setS(s, b) { document.querySelectorAll('.sz-btn').forEach(x => x.classList.remove('sel-active')); b.classList.add('sel-active'); sS = s; }
        function setC(c, b) { document.querySelectorAll('.cl-btn').forEach(x => x.classList.remove('sel-active')); b.classList.add('sel-active'); sC = c; }
        function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function toggleWish(id) {
            let w = JSON.parse(localStorage.getItem('wish_'+currentUser.mobile) || '[]');
            w = w.includes(id) ? w.filter(x => x !== id) : [...w, id];
            localStorage.setItem('wish_'+currentUser.mobile, JSON.stringify(w)); openProduct(id);
        }

        async function initOrder(m) {
            if(!sS || !sC) return alert("Please select Size and Color");
            if(m === 'ONLINE') {
                const s = await db.collection('settings').doc('app').get();
                window.location.assign(`upi://pay?pa=${s.data().upi}&pn=Thrilok&am=${curQty*activeP.price}&cu=INR`);
                document.getElementById('pay-options').classList.add('hidden'); document.getElementById('utr-sec').classList.remove('hidden');
            } else { confirmFinalOrder('COD'); }
        }

        async function confirmFinalOrder(m) {
            const utr = document.getElementById('c-utr').value || 'N/A';
            await db.collection('orders').add({
                uid: currentUser.mobile, product: activeP.name, price: activeP.price * curQty, qty: curQty, size: sS, color: sC,
                payMethod: m, status: 'Pending', utr: utr,
                customer: { n: document.getElementById('c-name').value, p: document.getElementById('c-phone').value, a: document.getElementById('c-addr').value },
                time: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('checkout-modal').classList.add('hidden');
            document.getElementById('product-modal').classList.add('hidden');
            document.getElementById('success-overlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('success-overlay').style.display = 'none'; showSection('orders'); }, 2000);
        }

        async function cancelOrder(id) {
            if(confirm("Confirm to cancel order?")) {
                await db.collection('orders').doc(id).delete();
                alert("Order Cancelled.");
            }
        }

        function showSection(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
            document.getElementById(id + '-sec').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-'+id).classList.add('active');

            if(id === 'wishlist') render(allProducts.filter(p => (JSON.parse(localStorage.getItem('wish_'+currentUser.mobile)||'[]')).includes(p.id)), 'wish-grid');
            if(id === 'orders') {
                db.collection('orders').onSnapshot(snap => {
                    const myOrders = snap.docs.filter(doc => doc.data().uid === currentUser.mobile);
                    document.getElementById('orders-list').innerHTML = myOrders.map(doc => `
                        <div class="glass p-5 rounded-2xl border border-white/5 space-y-4">
                            <div class="flex justify-between">
                                <div><h4 class="font-black text-[11px] uppercase text-blue-500">${doc.data().product}</h4><p class="text-[9px] opacity-40">Total: ₹${doc.data().price}</p></div>
                                <span class="text-[8px] font-black uppercase text-blue-500 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">${doc.data().status}</span>
                            </div>
                            ${doc.data().status === 'Pending' ? `<button onclick="cancelOrder('${doc.id}')" class="w-full bg-red-500/10 text-red-500 py-3 rounded-xl text-[9px] font-black uppercase border border-red-500/10">Cancel Order</button>` : ''}
                        </div>`).join('') || '<p class="text-center opacity-20 py-20 uppercase font-black text-xs">No Gear Found</p>';
                });
            }
        }

        function filterCat(c, b) {
            document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('bg-blue-600'));
            if(b) b.classList.add('bg-blue-600');
            render(c==='All'?allProducts:allProducts.filter(p=>p.category===c), 'p-grid');
        }
        function searchProduct() { render(allProducts.filter(p=>p.name.toLowerCase().includes(document.getElementById('p-search').value.toLowerCase())), 'p-grid'); }
    </script>
</body>
</html>
